input {
  file {
    path => "/var/log/cowrie/cowrie.log"
    type => "cowrie"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
  
  file {
    path => "/var/log/dionaea/dionaea.log"
    type => "dionaea"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # ------------------ COWRIE PARSING ------------------
  if [type] == "cowrie" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:hostname} %{WORD:process}\[%{INT:pid}\]: %{GREEDYDATA:event_message}" 
      }
    }
    
    if [event_message] =~ /login attempt/ {
      grok {
        match => { 
          "event_message" => "login attempt \[%{USERNAME:username}\] from %{IP:src_ip}:%{INT:src_port}" 
        }
      }
      mutate { add_field => { "event_type" => "login_attempt" } }
    }
    
    if [event_message] =~ /command/ {
      grok {
        match => { 
          "event_message" => "command: %{GREEDYDATA:command}" 
        }
      }
      mutate { add_field => { "event_type" => "command_executed" } }
    }
    
    if [event_message] =~ /session closed/ {
      mutate { add_field => { "event_type" => "session_end" } }
    }
  }
  
  # ------------------ DIONAEA PARSING ------------------
  if [type] == "dionaea" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:level} %{WORD:component}: %{GREEDYDATA:event_message}" 
      }
    }
    
    if [event_message] =~ /connection accepted/ {
      grok {
        match => { 
          "event_message" => "connection accepted from %{IP:src_ip}:%{INT:src_port}" 
        }
      }
      mutate { add_field => { "event_type" => "connection" } }
    }
    
    if [event_message] =~ /malware/ or [event_message] =~ /virus/ {
      mutate { add_field => { "event_type" => "malware_detected" } }
    }
  }
  
  # ------------------ ENRICHMENT (Disabled for 50%) ------------------
  # GeoIP will be added in Phase 2
  # geoip {
  #   source => "src_ip"
  #   target => "geoip"
  # }
  
  # ------------------ TIMESTAMP ------------------
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # ------------------ CLEANUP ------------------
  mutate {
    remove_field => [ "host", "path", "message" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "honeypot-%{+YYYY.MM.dd}"
  }
  
  # Debug output (uncomment to see logs in console)
  # stdout { codec => rubydebug }
}